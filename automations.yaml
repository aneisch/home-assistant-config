- id: update_Readme
  alias: Update README
  trigger:
  - platform: time
    at: '11:00:00'
  - platform: time
    at: '21:00:00'
  - platform: homeassistant
    event: start
  action:
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - action: readme.generate
    data: {}
  initial_state: true
- alias: Set dark theme for night
  id: dark_theme
  initial_state: true
  trigger:
  - platform: time
    at: '21:00:00'
  - platform: homeassistant
    event: start
  condition:
    condition: time
    after: '20:59:00'
    before: 08:59:00
  action:
  - action: frontend.set_theme
    data:
      name: Google Dark Theme
- alias: Set light theme for day
  id: light_theme
  initial_state: true
  trigger:
  - platform: time
    at: 08:00:00
  - platform: homeassistant
    event: start
  condition:
    condition: time
    after: 07:59:00
    before: '20:59:00'
  action:
    action: frontend.set_theme
    data:
      name: default
- alias: Security Arm/Disarm
  id: arm_disarm
  initial_state: true
  trigger:
    platform: state
    entity_id: input_boolean.security_status
  action:
  - action: script.turn_on
    data:
      entity_id: "{% if trigger.to_state.state == 'on' %}\n  script.security_arm\n{%
        elif trigger.to_state.state == 'off' %}\n  script.security_disarm\n{% endif
        %}\n"
- alias: House Occupied/Empty
  id: occupied_empty
  initial_state: true
  trigger:
  - platform: state
    entity_id: group.trackers
    to: not_home
    for:
      minutes: 1
  - platform: state
    entity_id: group.trackers
    to: home
  condition:
    condition: state
    entity_id: input_boolean.guest_mode
    state: 'off'
  action:
  - action: script.turn_on
    data:
      entity_id: "{% if trigger.to_state.state == 'home' %}\n  script.home_occupied\n{%
        elif trigger.to_state.state == 'not_home' %}\n  script.home_empty\n{% endif
        %}\n"
  - delay: 00:02:00
- alias: Mount/Umount /Plex
  id: mount_unmount_plex
  initial_state: true
  trigger:
  - platform: state
    entity_id: switch.nas
    from: 'off'
    to: 'on'
    for:
      seconds: 30
  - platform: state
    entity_id: switch.nas
    from: 'on'
    to: 'off'
    for:
      seconds: 30
  action:
    action: "{% if trigger.to_state.state == 'on' %}\n  shell_command.mount_plex\n{%
      elif trigger.to_state.state == 'off' %}\n  shell_command.umount_plex\n{% endif
      %}\n"
- id: notify_ac_offline
  alias: Notify when AC Offline
  triggers:
  - trigger: state
    entity_id: binary_sensor.thermostat_online
    to: 'off'
    for: 00:30:00
  - trigger: state
    entity_id: climate.thermostat
    to: unavailable
    for:
      minutes: 10
  actions:
  - action: script.notify_wrapper
    data:
      message: The thermostat is unresponsive or offline. Triggered by {{ trigger.to_state.entity_id
        }}
  initial_state: true
- id: notify_ac_equipment_event
  alias: Notify AC Equipment Event Occurs
  triggers:
  - trigger: state
    entity_id:
    - sensor.thermostat_active_alerts
    - sensor.ac_compressor_alarm
    - sensor.ac_low_pressure_switch
    - sensor.ac_high_pressure_switch
    - sensor.ac_top_cap_switch
  variables:
    ignored_alert_codes:
    - 65546
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unavailable'', ''unknown'', ''''] and trigger.to_state.state not in
      [''unavailable'', ''unknown'', ''''] }}'
  - condition: template
    value_template: '{{ trigger.entity_id != ''sensor.thermostat_active_alerts'' or
      ((trigger.from_state.attributes.alert_list or []) | map(attribute=''code'')
      | map(''int'', 0) | reject(''in'', ignored_alert_codes) | sort | list) != ((trigger.to_state.attributes.alert_list
      or []) | map(attribute=''code'') | map(''int'', 0) | reject(''in'', ignored_alert_codes)
      | sort | list) }}'
  actions:
  - action: script.notify_wrapper
    data:
      message: '{% set e = trigger.entity_id %}{% set s = trigger.to_state.state %}{%
        if e == ''sensor.thermostat_active_alerts'' %}{% set alerts = state_attr(e,
        ''alert_list'') or [] %}{% set n = alerts | map(attribute=''code'') | map(''int'',
        0) | reject(''in'', ignored_alert_codes) | list | count %}{% if n == 0 %}AC
        Equipment Event from Thermostat Cleared{% else %}AC Equipment Event from Thermostat
        ({{ n }} active): {% for a in alerts if a.code | int(0) not in ignored_alert_codes
        %}code {{ a.code }} ({{ a.priority }}{% if a.message and a.message != ''unknown
        alert code'' %}, {{ a.message }}{% endif %}){% if not loop.last %}; {% endif
        %}{% endfor %}{% endif %}{% elif e == ''sensor.ac_compressor_alarm'' %}{%
        if s in [''0'', ''0.0''] %}AC Compressor Alarm Cleared{% else %}AC Compressor
        Alarm: {{ s }}{% endif %}{% else %}{{ trigger.to_state.name }}: {{ s }}{%
        endif %}'
  initial_state: true
- id: ac_notify_change
  alias: Notify when AC setting changes
  triggers:
  - trigger: state
    entity_id: climate.thermostat
    id: mode
  - trigger: state
    entity_id: climate.thermostat
    attribute: temperature
    id: setpoint
  conditions:
  - condition: state
    entity_id: input_boolean.ac_change_notification
    state: 'on'
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unavailable'', ''unknown''] and trigger.to_state.state not in [''unavailable'',
      ''unknown''] and (trigger.from_state.state != trigger.to_state.state or trigger.from_state.attributes.temperature
      != trigger.to_state.attributes.temperature) }}'
  actions:
  - action: script.notify_wrapper
    data:
      message: '{% if trigger.id == ''setpoint'' %}Setpoint{% else %}Mode{% endif
        %}: {{ state_attr(''climate.thermostat'', ''temperature'') }}. Mode: {{ states(''climate.thermostat'')
        }}'
  initial_state: true
- id: update_last_datetimes
  alias: Update 'Last' Datetimes
  trigger:
  - platform: state
    entity_id:
    - input_boolean.kitchen_motion
    - binary_sensor.living_room_motion
    - binary_sensor.hallway_motion
    - binary_sensor.garage_person_occupancy
    - binary_sensor.433_motion_master_bathroom
    from: 'off'
    to: 'on'
  action:
  - if: '{{ trigger.entity_id == ''binary_sensor.garage_person_occupancy'' }}'
    then:
    - action: input_datetime.set_datetime
      data:
        entity_id: input_datetime.garage_motion_last
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    else:
    - action: input_datetime.set_datetime
      data:
        entity_id: input_datetime.{{trigger.entity_id | regex_replace(find='binary_sensor.',
          replace='') | regex_replace(find='input_boolean.', replace='') | regex_replace(find='sensor.',
          replace='') }}_last
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
- alias: Door Lock Alerts
  id: door_lock_alerts
  initial_state: true
  trigger:
    platform: state
    entity_id:
    - lock.front_door
    - lock.garage_exterior_door
    - lock.back_door
    to: unlocked
  condition: '{{ states(''input_boolean.door_notify'') == ''on''}}'
  action:
  - action: script.notify_wrapper
    data:
      message: '{{ trigger.to_state.name }} Unlocked'
      data:
        priority: 1
- id: terraform_cloud_webhook
  alias: Terraform Cloud Webhook
  trigger:
  - platform: webhook
    webhook_id: SECRET
    local_only: false
    allowed_methods:
    - POST
  action:
  - action: script.notify_wrapper
    data:
      message: '{{ trigger.json.notifications[0].message }}: {{ trigger.json.run_url
        }}'
  initial_state: true
- alias: Power off NAS after backup
  id: nas_poweroff_post_backup
  initial_state: true
  trigger:
    platform: state
    entity_id: binary_sensor.backups_complete
    to: 'on'
  condition:
    condition: time
    after: 03:00:00
    before: 05:00:00
    weekday:
    - wed
  action:
    action: homeassistant.turn_off
    entity_id:
    - switch.nas
    - binary_sensor.backups_complete
- id: spotify_reaction
  alias: React to Spotify Starting to Play
  triggers:
  - entity_id: media_player.spotify
    attribute: source
    to: Office
    trigger: state
  - entity_id: media_player.spotify
    attribute: source
    to: Everywhere
    trigger: state
  - entity_id: media_player.spotify
    to: playing
    trigger: state
  - entity_id: media_player.spotify
    attribute: source
    to: Kitchen
    trigger: state
  - trigger: state
    entity_id:
    - media_player.sendspin_2
    to:
    - playing
    id: sendspin_playing
  - trigger: state
    entity_id:
    - media_player.sendspin_2
    to:
    - 'off'
    id: sendspin_off
  actions:
  - if:
    - condition: template
      value_template: '{{ states(''media_player.spotify'') == ''playing'' and states(''switch.andrew_office_speakers'')
        == ''off'' and state_attr(''media_player.spotify'', ''source'') in [''Everywhere'',
        ''Office''] }}'
    then:
    - action: homeassistant.turn_on
      entity_id: switch.andrew_office_speakers
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''sendspin_playing'' }}'
    then:
    - action: homeassistant.turn_on
      entity_id: switch.andrew_office_speakers
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''sendspin_off'' }}'
    then:
    - action: homeassistant.turn_off
      entity_id: switch.andrew_office_speakers
  initial_state: true
- id: desk_lamp_macbook_active
  alias: Desk Lamp on when MacBook Active
  trigger:
  - platform: state
    entity_id: binary_sensor.weasel_active
    to: 'on'
  condition:
  - condition: template
    value_template: '{{ states(''person.andrew'') == ''home'' }}'
  action:
  - if:
    - condition: template
      value_template: '{{ states(''sun.sun'') == ''below_horizon'' or (states(''cover.office_blind_left'')
        == ''closed'' and states(''cover.office_blind_right'') == ''closed'') }}'
    then:
    - action: homeassistant.turn_on
      entity_id: light.andrew_desk_lamp
  - action: homeassistant.turn_on
    entity_id:
    - switch.andrew_monitor
    - media_player.kitchen_photo_frame
    - media_player.office_photo_frame
  - condition: time
    after: 08:00:00
    before: '21:00:00'
  - action: input_boolean.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.goodnight
  initial_state: true
- id: desk_lamp_and_monitor_off
  alias: Desk Lamp and Monitor off
  triggers:
  - entity_id: binary_sensor.weasel_active
    to: 'off'
    for: 00:30:00
    trigger: state
  actions:
  - action: homeassistant.turn_off
    entity_id: light.andrew_desk_lamp
  - action: homeassistant.turn_off
    entity_id: switch.andrew_monitor
    enabled: true
  initial_state: true
- alias: Tablet off After Monitor
  id: tablet_off_after_monitor
  initial_state: true
  trigger:
    platform: state
    entity_id: switch.andrew_monitor
    to: 'off'
    for: 00:00:30
  action:
  - action: homeassistant.turn_off
    entity_id: switch.fire_tablet_screen
- alias: Master Closet Light with Motion
  id: closet_motion_light
  trigger:
  - platform: state
    entity_id: binary_sensor.master_closet_motion_sensor
    to: 'on'
  mode: restart
  action:
  - action: homeassistant.turn_on
    entity_id: switch.master_closet_light
  - delay: 00:05:00
  - action: homeassistant.turn_off
    entity_id: switch.master_closet_light
- alias: Update CloudFlare Firewall Rule
  id: update_cloudflare_firewall_rule
  trigger:
  - platform: state
    entity_id: sensor.myip
  condition: '{{ trigger.to_state.state not in ["unknown","unavailable"] }}'
  action:
  - action: shell_command.update_cloudflare_firewall
    data:
      old: '{{ trigger.from_state.state }}'
      new: '{{ trigger.to_state.state }}'
- id: disarm_when_garage_opened
  alias: Disarm When Opening Garage
  triggers:
  - event_type: call_service
    event_data:
      domain: cover
      service: open_cover
      service_data:
        entity_id: cover.garage_door
    trigger: event
  actions:
  - action: input_boolean.turn_off
    entity_id: input_boolean.security_status
- alias: Commit Frigate Config
  id: commit_frigate_config
  trigger:
    platform: event
    event_type: folder_watcher
    event_data:
      event_type: modified
      file: config.yml
  action:
  - action: shell_command.commit_frigate_changes
- alias: Compost Turn Reset
  id: compost_turn_reset
  trigger:
  - platform: state
    entity_id: input_boolean.compost_turn
    to: 'on'
  action:
  - delay: 00:01:00
  - action: homeassistant.turn_off
    entity_id: input_boolean.compost_turn
- id: internet_reachability_alert
  alias: Internet Reachability Alert
  description: ''
  triggers:
  - entity_id: binary_sensor.internet_reachability
    from: 'on'
    to: 'off'
    id: binary
    trigger: state
  - entity_id: binary_sensor.internet_reachability
    from: 'off'
    to: 'on'
    id: binary
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.goodnight
    state:
    - 'off'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''binary'' }}'
    then:
    - alias: Z-Wave Siren Speak Alert
      if:
      - condition: template
        value_template: '{{ is_state(''person.andrew'', ''home'') and is_state(''input_boolean.goodnight'',
          ''off'') and is_state(''switch.master_bedroom_ceiling_fan'', ''off'') }}'
      then:
      - action: siren.turn_on
        target:
          entity_id: siren.siren_chime_play_tone
        data:
          tone: '{% if trigger.from_state.state == ''on'' %} {{ state_attr(''siren.siren_chime_play_tone'',
            ''available_tones'') |dictsort |selectattr(''1'', ''search'', ''internet_outage.mp3'')
            |map(attribute=''0'') |first }} {% else %} {{ state_attr(''siren.siren_chime_play_tone'',
            ''available_tones'') |dictsort |selectattr(''1'', ''search'', ''internet_recovered.mp3'')
            |map(attribute=''0'') |first }} {% endif %}

            '
          volume_level: 0.5
    - action: script.notify_wrapper
      data:
        message: '{% if trigger.from_state.state == "on" %} Home internet is down
          {% else %} Home internet has recovered {% endif %}

          '
        data:
          priority: '{% if now().hour > 9 and now().hour < 22 and is_state(''person.andrew'',
            ''home'') %}1{% else %}0{% endif %}'
      enabled: true
- id: webhook_debugger
  alias: Webhook Debugger
  triggers:
  - webhook_id: hihihi
    local_only: false
    trigger: webhook
    allowed_methods:
    - POST
    - PUT
  actions:
  - action: persistent_notification.create
    data:
      message: "{% if 'data' in trigger %}\n  Data: {{ dict(trigger.data)|tojson }}\n{%
        elif 'json' in trigger %}\n  JSON: {{ dict(trigger.json)|tojson }}\n{% else
        %} {% endif %} {% if 'query' in trigger and trigger.query|length > 0 %}\n
        \ Query: {{ dict(trigger.query)|tojson }}\n{% endif %}"
- alias: Watchtower Updates
  id: watchertower_run_update
  trigger:
  - platform: time
    at: '15:00:00'
  - platform: time
    at: '20:00:00'
  condition:
    condition: and
    conditions:
    - condition: time
      weekday:
      - sun
    - '{{ states(''person.andrew'') == ''home''}}'
  action:
  - action: homeassistant.turn_on
    entity_id: switch.docker_watchtower
- id: watchtower_notifications
  alias: Watchtower Notifications
  triggers:
  - webhook_id: watchtower_notifications
    local_only: false
    trigger: webhook
    allowed_methods:
    - POST
  actions:
  - action: script.notify_wrapper
    data:
      message: '{{ trigger.json.message }}'
- id: update_utility_costs
  alias: Update Utility Costs
  triggers:
  - trigger: time_pattern
    minutes: /30
  - at: '23:59:30'
    trigger: time
  actions:
  - action: python_script.compute_utility_costs
    data:
      meter_entity: sensor.water_usage
    alias: Water
  - alias: Electricity
    action: python_script.compute_utility_costs
    data:
      meter_entity: sensor.electricity_usage
  - alias: Electricity Credit
    action: python_script.compute_utility_costs
    data:
      meter_entity: sensor.electricity_sell
  - alias: Tesla Charging
    action: python_script.compute_utility_costs
    data:
      meter_entity: sensor.monthly_tesla_electric_usage
  mode: single
- id: reset_utility_meters
  alias: Reset Utility Meters
  triggers:
  - at: 00:00:00
    enabled: true
    trigger: time
  conditions: []
  actions:
  - action: python_script.utility_meter_reset
    data:
      meter_entity: sensor.water_usage
      cycle_reset_entity_id: sensor.utilities_cycle_end
    alias: Water
  - action: python_script.utility_meter_reset
    data:
      meter_entity: sensor.electricity_usage
      cycle_reset_entity_id: sensor.utilities_cycle_end
    alias: Electric Import
  - action: python_script.utility_meter_reset
    data:
      meter_entity: sensor.electricity_sell
      cycle_reset_entity_id: sensor.utilities_cycle_end
    alias: Electric Export
  - action: python_script.utility_meter_reset
    data:
      meter_entity: sensor.electricity_sell_offset
      cycle_reset_entity_id: sensor.utilities_cycle_end
    alias: Electric Offset
  - alias: Tesla Electric
    action: python_script.utility_meter_reset
    data:
      meter_entity: sensor.monthly_tesla_electric_usage
      cycle_reset_entity_id: sensor.utilities_cycle_end
  - alias: Tesla Miles
    action: python_script.utility_meter_reset
    data:
      meter_entity: sensor.monthly_tesla_miles
      cycle_reset_entity_id: sensor.utilities_cycle_end
- id: fingerprint_door_unlock
  alias: Fingerprint Door Unlock
  description: ''
  triggers:
  - entity_id: sensor.fingerprint_state
    to: Authorized finger
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.fingerprint_last_finger_id'') in [''1.0'',''2.0'']
      }}'
    enabled: false
  actions:
  - action: script.notify_wrapper
    data:
      message: Tesla unlocked and started by {% if states('sensor.fingerprint_last_finger_id')
        in ['1.0','2.0'] %}Andrew{% elif states('sensor.fingerprint_last_finger_id')
        == '3.0' %}Bethany{% else %}Unknown{% endif %}!
    enabled: true
  - action: button.press
    metadata: {}
    data: {}
    target:
      entity_id: button.tesla_ble_remote_start_car
- id: signal_webhook_message_bvst
  alias: Signal Webhook Message BVST
  triggers:
  - webhook_id: SECRET
    id: contact
    local_only: false
    trigger: webhook
  - webhook_id: SECRET
    id: insurance
    local_only: false
    trigger: webhook
  - webhook_id: SECRET_horizon
    id: insurance_horizon
    local_only: false
    trigger: webhook
    allowed_methods:
    - POST
    - PUT
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''contact'' }}'
    then:
    - action: notify.signal_bvst
      data:
        message: '{{ trigger.json[''message'']| e }}'
    - action: notify.bethany_brazosvalleyspeechtherapy_com
      data:
        target: bethany@brazosvalleyspeechtherapy.com
        title: New Inquiry
        message: "<div style=\"font-family:sans-serif;font-size:14px\"> {{ trigger.json.message\n
          \  | replace('\\r\\n', '\\n')\n   | e\n   | regex_replace('--- (.+?) ---\\n\\n',
          '<b>\\\\1</b><br>')\n   | replace('\\n', '<br>') }}\n</div>"
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''insurance'' }}'
    then:
    - action: notify.signal_bvst_ins
      data:
        message: '{{ trigger.json[''message''] }}'
        data:
          text_mode: styled
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''insurance_horizon'' }}'
    then:
    - action: notify.signal_bvst_ins_horizon
      data:
        message: '{{ trigger.json[''message''] }}'
        data:
          text_mode: styled
  mode: queued
  initial_state: true
- alias: Restart AppDaemon
  id: restart_appdaemon
  trigger:
    platform: time
    at: 01:30:00
  action:
  - action: switch.turn_off
    entity_id: switch.docker_appdaemon
  - delay: 00:00:30
  - action: switch.turn_on
    entity_id: switch.docker_appdaemon
- id: door_chime
  alias: Door Chime
  triggers:
  - entity_id:
    - cover.garage_door
    from: closed
    to: open
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(''group.trackers'') == ''home''}}'
  - condition: state
    entity_id: input_boolean.goodnight
    state: 'off'
  - condition: state
    entity_id: switch.master_bedroom_ceiling_fan
    state: 'off'
  actions:
  - action: notify.alexa_media_kitchen
    data:
      data:
        type: tts
        method: speak
      message: <audio src="soundbank://soundlibrary/alarms/beeps_and_bloops/bell_02"/>
    enabled: false
  - action: siren.turn_on
    target:
      entity_id: siren.siren_chime_play_tone
    data:
      volume_level: 0.5
      tone: '{{ state_attr(''siren.siren_chime_play_tone'', ''available_tones'') |dictsort
        |selectattr(''1'', ''search'', ''bell_02'') |map(attribute=''0'') |first }}

        '
  initial_state: true
- alias: Startup Notificiation
  id: startup_notification
  initial_state: true
  trigger:
  - platform: homeassistant
    event: start
  action:
  - action: script.notify_wrapper
    data:
      message: 'Home Assistant v{{ states(''sensor.ha_version'')}} has started!

        '
  - action: shell_command.trust_signal_identities
- id: coffee_maker_alarm_clock
  alias: Coffee Maker on With Alarm Clock
  trigger:
  - platform: state
    entity_id: sensor.andrew_phone_last_notification
    attribute: channel_id
    to: Firing
    id: alarm
    alias: Phone Alarm
  - platform: event
    id: respond
    event_type: mobile_app_notification_action
    event_data:
      action: confirm_coffee_on
    alias: Mobile Notification Response
  - alias: Mobile Notification Response
    platform: event
    id: make
    event_type: mobile_app_notification_action
    event_data:
      action: confirm_make_latte
  condition:
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ states(''binary_sensor.workday_sensor'') == ''on'' }}'
      alias: Workday?
      enabled: false
    - condition: time
      after: 05:30:00
      before: '10:00:00'
      enabled: true
      alias: Morning?
    - condition: template
      value_template: '{{ states(''person.andrew'') == ''home'' }}'
      alias: Andrew Home?
  action:
  - if:
    - condition: trigger
      id:
      - alarm
    then:
    - wait_template: '{{ is_state(''sensor.andrew_phone_charger_type'', ''none'')
        }}'
      timeout: 00:05:00
    - action: script.notify_wrapper
      data:
        message: Turn on Coffee Maker?
        level: alert
        signal: false
        tag: coffee_on_prompt
        actions:
        - action: confirm_coffee_on
          title: 'Yes'
        - action: ignore_coffee_on
          title: 'No'
    alias: Send Notification
  - alias: Turn on Coffee Maker
    if:
    - condition: trigger
      id:
      - respond
    then:
    - action: notify.andrew
      data:
        message: clear_notification
        data:
          tag: coffee_on_prompt
      alias: Clear prompt on other devices
    - action: switch.turn_on
      data: {}
      target:
        entity_id: switch.coffee_maker_power_with_cleaning
      alias: Turn on Coffee Maker
    - wait_for_trigger:
      - platform: state
        entity_id:
        - sensor.coffee_maker_status
        to: Idle
        for:
          hours: 0
          minutes: 1
          seconds: 0
      timeout:
        hours: 0
        minutes: 2
        seconds: 0
        milliseconds: 0
      alias: Wait For Idle Status
    - action: script.notify_wrapper
      data:
        message: Make Double Latte?
        level: alert
        signal: false
        tag: make_latte_prompt
        actions:
        - action: confirm_make_latte
          title: 'Yes'
        - action: ignore_make_latte
          title: 'No'
      alias: Send Make Late Question
  - alias: Make Double Latte
    if:
    - condition: trigger
      id:
      - make
    then:
    - action: notify.andrew
      data:
        message: clear_notification
        data:
          tag: make_latte_prompt
      alias: Clear prompt on other devices
    - action: script.andrew_double_latte
      data: {}
  initial_state: true
