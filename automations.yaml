    - sensor.office_ap_to_main_ap_speed
    from:
    - 1Gbps
  conditions: []
  actions:
  - action: script.notify_wrapper
    metadata: {}
    data:
      message: Network Link Speed Changed!
  mode: single
- id: '1790715171437'
  alias: OpenBao Sealed
  description: Notify when OpenBao becomes sealed and when it is unsealed again.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.openbao_sealed
    to:
    - 'on'
    id: sealed
  - trigger: state
    entity_id:
    - binary_sensor.openbao_sealed
    from:
    - 'on'
    to:
    - 'off'
    id: unsealed
    note: 'from: on so an unavailable -> off blip doesn''t send a false ''unsealed''
      alert.'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sealed
      sequence:
      - action: notify.signal_bvst_ins_horizon
        metadata: {}
        data:
          message: OpenBao sealed and needs unsealing!
    - conditions:
      - condition: trigger
        id: unsealed
      sequence:
      - action: notify.signal_bvst_ins_horizon
        metadata: {}
        data:
          message: OpenBao has been unsealed.
  mode: queued
- id: '1791158732972'
  alias: 'AC: record per-run split'
  description: 'Records every cooling run when it ends: final (≈ peak) return-minus-supply
    split into input_number.ac_run_split, plus a logbook entry with run length, compressor
    speed, airflow and refrigerant readings. Runs shorter than 5 minutes are ignored:
    at 20 Hz the office register sensor is still catching up after ~3 min, so short
    shoulder-season cycles would read falsely low (e.g. 7–11°F on Oct 22 evening).
    input_datetime.ac_run_start holds the start of the current run.'
  triggers:
  - trigger: state
    entity_id: sensor.thermostat_state
    to: Cooling
    id: start
    note: Cooling call began; stamp the run start.
  - trigger: state
    entity_id: sensor.ac_split
    to: unknown
    id: end
    note: ac_split goes unknown the moment cooling stops; from_state holds the last
      (≈ peak) split of the run.
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ac_run_start
        data:
          timestamp: '{{ now().timestamp() }}'
    - conditions:
      - condition: trigger
        id: end
      - condition: template
        value_template: '{{ trigger.from_state is not none and is_number(trigger.from_state.state)
          and state_attr(''input_datetime.ac_run_start'', ''timestamp'') is not none
          and (now().timestamp() - state_attr(''input_datetime.ac_run_start'', ''timestamp''))
          >= 300 }}'
        note: 'Only real runs: last split numeric and run lasted at least 5 minutes.'
      sequence:
      - variables:
          split: '{{ trigger.from_state.state | float }}'
          run_min: '{{ ((now().timestamp() - state_attr(''input_datetime.ac_run_start'',
            ''timestamp'')) / 60) | round(1) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.ac_run_split
        data:
          value: '{{ split }}'
      - action: logbook.log
        data:
          name: AC run split
          entity_id: input_number.ac_run_split
          message: '{{ split }}°F after {{ run_min }} min — compressor {{ states(''sensor.ac_compressor_speed'')
            }} Hz, cooling rate {{ states(''sensor.ac_cooling_rate'') }}%, blower
            {{ states(''sensor.furnace_blower_cfm'') }} CFM, subcool {{ states(''sensor.ac_subcooling'')
            }}°F, superheat {{ states(''sensor.ac_superheat'') }}°F — return {{ states(''sensor.ac_return_temperature'')
            }}°F / {{ states(''sensor.ac_return_humidity'') }}%, supply {{ states(''sensor.andrew_office_register_temperature'')
            }}°F, outdoor {{ states(''sensor.amb_outdoor_temperature'') }}°F, inverter
            {{ states(''sensor.ac_inverter_power'') }} W'
  mode: queued
  max: 5
- id: '1791158737603'
  alias: 'AC: low split alert'
  description: Notify when a per-run AC split drops below 14°F (healthy is ~18-20°F).
    Leave disabled until after the refrigerant repair.
  triggers:
  - trigger: numeric_state
    entity_id: input_number.ac_run_split
    below: 14
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unknown'', ''unavailable''] }}'
  actions:
  - action: persistent_notification.create
    data:
      title: AC split low
      notification_id: ac_low_split
      message: Per-run AC split was {{ states('input_number.ac_run_split') }}°F (healthy
        ~18-20°F). Possible refrigerant loss or airflow issue.
  mode: single
- id: '1792605548517'
  alias: 'HVAC: keep Lennox diagnostic level at 2'
  description: Keeps number.thermostat_diagnostic_level at 2 so the lennoxs30 diagnostic
    sensors (subcooling, superheat, pressures, compressor speed, blower CFM) stay
    populated. Re-applies after changes, HA restart, and every 30 minutes as a backstop.
  triggers:
  - trigger: state
    entity_id: number.thermostat_diagnostic_level
    for:
      seconds: 30
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /30
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: number.thermostat_diagnostic_level
      below: 2
    - condition: numeric_state
      entity_id: number.thermostat_diagnostic_level
      above: 2
  actions:
  - action: number.set_value
    target:
      entity_id: number.thermostat_diagnostic_level
    data:
      value: 2
  - action: logbook.log
    data:
      name: HVAC diagnostics
      entity_id: number.thermostat_diagnostic_level
      message: Diagnostic level was {{ states('number.thermostat_diagnostic_level')
        }}; set back to 2
  mode: single
- id: '1792859883916'
  alias: 'HVAC: pause fan circulation when humid or hot'
  description: Switches the thermostat fan from circulate (10 min/hr) to auto when
    return-air humidity stays above 55% or outdoor temperature above 90°F, so circulation
    doesn't re-evaporate the wet coil or pull hot attic-duct air. Turns circulate
    back on once humidity is below 52% and outdoor below 82°F. Only undoes its own
    pause (input_boolean.hvac_circulation_paused_by_automation), so a fan mode set
    by hand to 'on' or 'auto' outside a pause is left alone.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.ac_return_humidity
    above: 55
    for:
      minutes: 30
    id: humid
  - trigger: numeric_state
    entity_id: sensor.amb_outdoor_temperature
    above: 90
    for:
      minutes: 30
    id: hot
  - trigger: numeric_state
    entity_id: sensor.ac_return_humidity
    below: 52
    for:
      hours: 1
    id: dry
  - trigger: numeric_state
    entity_id: sensor.amb_outdoor_temperature
    below: 82
    for:
      hours: 1
    id: mild
  - trigger: homeassistant
    event: start
    id: start
    note: 'Re-check after a restart, since numeric_state for: clocks reset.'
  actions:
  - choose:
    - alias: Pause circulation
      conditions:
      - condition: state
        entity_id: climate.thermostat
        attribute: fan_mode
        state: circulate
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.ac_return_humidity
          above: 55
        - condition: numeric_state
          entity_id: sensor.amb_outdoor_temperature
          above: 90
      sequence:
      - action: climate.set_fan_mode
        target:
          entity_id: climate.thermostat
        data:
          fan_mode: auto
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_circulation_paused_by_automation
      - action: logbook.log
        data:
          name: HVAC circulation
          entity_id: climate.thermostat
          message: 'Paused (fan → auto): return RH {{ states(''sensor.ac_return_humidity'')
            }}%, outdoor {{ states(''sensor.amb_outdoor_temperature'') }}°F'
    - alias: Resume circulation
      conditions:
      - condition: state
        entity_id: input_boolean.hvac_circulation_paused_by_automation
        state: 'on'
      - condition: state
        entity_id: climate.thermostat
        attribute: fan_mode
        state: auto
      - condition: numeric_state
        entity_id: sensor.ac_return_humidity
        below: 52
      - condition: numeric_state
        entity_id: sensor.amb_outdoor_temperature
        below: 82
      sequence:
      - action: climate.set_fan_mode
        target:
          entity_id: climate.thermostat
        data:
          fan_mode: circulate
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hvac_circulation_paused_by_automation
      - action: logbook.log
        data:
          name: HVAC circulation
          entity_id: climate.thermostat
          message: 'Resumed (fan → circulate): return RH {{ states(''sensor.ac_return_humidity'')
            }}%, outdoor {{ states(''sensor.amb_outdoor_temperature'') }}°F'
  mode: queued
  max: 5
- id: hvac_dehumidify_boost
  alias: 'HVAC: boost dehumidification when humid'
  description: Uses the same return-air humidity thresholds as the circulation pause.
    When RH stays above 55% for 30 min in a cooling mode, sets Lennox dehumidification
    to max with 3°F overcooling (the system may cool up to 3°F below setpoint to
    reach the 50% humidity setpoint). Once RH is below 52% for an hour, drops
    overcooling back to 1°F. Only undoes its own boost, so a hand-set overcooling
    other than 3°F is left alone.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.ac_return_humidity
    above: 55
    for:
      minutes: 30
    id: humid
  - trigger: numeric_state
    entity_id: sensor.ac_return_humidity
    below: 52
    for:
      hours: 1
    id: dry
  - trigger: homeassistant
    event: start
    id: start
  variables:
    boost_overcool: 3
    normal_overcool: 1
  actions:
  - choose:
    - alias: Boost
      conditions:
      - condition: state
        entity_id: climate.thermostat
        state:
        - cool
        - heat_cool
      - condition: numeric_state
        entity_id: sensor.ac_return_humidity
        above: 55
      - '{{ states(''select.hvac_dehumidification_mode'') != ''max'' or states(''number.hvac_dehumidification_overcooling'')
        | int(0) < boost_overcool }}'
      sequence:
      - action: select.select_option
        target:
          entity_id: select.hvac_dehumidification_mode
        data:
          option: max
      - action: number.set_value
        target:
          entity_id: number.hvac_dehumidification_overcooling
        data:
          value: '{{ boost_overcool }}'
      - action: logbook.log
        data:
          name: HVAC dehumidification
          entity_id: select.hvac_dehumidification_mode
          message: 'Boosted (max, {{ boost_overcool }}°F overcool): return RH {{ states(''sensor.ac_return_humidity'')
            }}%'
    - alias: Restore
      conditions:
      - condition: numeric_state
        entity_id: sensor.ac_return_humidity
        below: 52
      - '{{ states(''number.hvac_dehumidification_overcooling'') | int(0) == boost_overcool
        }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.hvac_dehumidification_overcooling
        data:
          value: '{{ normal_overcool }}'
      - action: logbook.log
        data:
          name: HVAC dehumidification
          entity_id: select.hvac_dehumidification_mode
          message: 'Restored ({{ normal_overcool }}°F overcool): return RH {{ states(''sensor.ac_return_humidity'')
            }}%'
  mode: queued
  max: 5
- id: sync_cleared_notifications
  alias: Sync Cleared Notifications
  description: When a tagged notification is dismissed on an Android device, clear
    it on every other device. Critical alerts (ACK_ tags) are left to their Acknowledge
    flow.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_cleared
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.tag is defined and trigger.event.data.tag
      and not trigger.event.data.tag.startswith(''ACK_'') }}'
  actions:
  - repeat:
      for_each:
      - andrew
      - bethany
      sequence:
      - action: notify.{{ repeat.item }}
        continue_on_error: true
        data:
          message: clear_notification
          data:
            tag: '{{ trigger.event.data.tag }}'
  mode: queued
  max: 20
