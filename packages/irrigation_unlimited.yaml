# DC Timer on Master Valve is MWF 5-7am

# Ensure 24v on before master
template:
  - switch:
      - name: "Sequenced Master Valve"
        unique_id: irrigation_master_sequenced
        # The switch state reflects the actual valve state
        state: "{{ is_state('switch.irrigation_master_valve', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.irrigation_24v_power
          - delay: "00:00:02"
          - action: switch.turn_on
            target:
              entity_id: switch.irrigation_master_valve
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.irrigation_master_valve
          - delay: "00:00:02"
          - action: switch.turn_off
            target:
              entity_id: switch.irrigation_24v_power

irrigation_unlimited:
  granularity: 5
  controllers:
    - name: "Home Unlimited Irrigation Controller"
      entity_id: "switch.sequenced_master_valve" 
      preamble: "00:00:05" # Opens master before opening zone
      postamble: "00:00:30" # How long to keep master on after all zones off
      enabled: true
      zones:
        - name: "Front Beds"
          entity_id: "switch.irrigation_front_beds"
          duration: "00:08"
          allow_manual: true

        - name: "Front Lawn"
          entity_id: "switch.irrigation_front_lawn"
          duration: "00:30"
          allow_manual: true

        - name: "Left and Main Rear Lawn"
          entity_id: "switch.irrigation_left_and_main_rear_lawn"
          duration: "00:30"
          allow_manual: true
        
        - name: "Front and Right Rear Lawn"
          entity_id: "switch.irrigation_front_and_right_rear_lawn"
          duration: "00:30"
          allow_manual: true

        - name: "Side Lawn"
          entity_id: "switch.irrigation_side_lawn"
          duration: "00:15"
          allow_manual: true

      sequences:
        - name: "Lawn Only"
          delay: "00:00:05" # Delay between zones
          schedules:
            - name: "Morning"
              time: "05:00"
              weekday:
                - mon
                #- wed
                - thu
                #- sun

          zones:
            - zone_id: 2 # Front Lawn
              duration: "00:25:00"
            - zone_id: 3 # Left and Main Rear
              duration: "00:30:00"
            - zone_id: 4 # Front and Right Rear
              duration: "00:30:00"
            - zone_id: 5 # Side Lawn
              duration: "00:15:00"

        - name: "Beds Only"
          delay: "00:00:05" # Delay between zones
          schedules:
            - name: "Morning"
              time: "06:50"
              weekday:
                - mon
                # - wed
                - thu
                #- sun

          zones:
            - zone_id: 1 # Front Beds
              duration: "00:08:00"