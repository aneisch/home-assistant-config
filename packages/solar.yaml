automation:
  - alias: Update Grid Rates on Oct 1 2026
    id: "update_utility_rates"
    description: Sets grid import and export rates at midnight on October 1, 2026.
    trigger:
      - platform: time
        at: "00:00:00"
    condition: "{{ now().strftime('%Y-%m-%d') == '2026-10-01' }}"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.grid_import_rate
        data:
          value: 0.1366
      - service: input_number.set_value
        target:
          entity_id: input_number.grid_export_rate
        data:
          value: 0.0550
      - service: script.notify_wrapper
        data:
          message: "Electric rate 2026 values updated!"
    mode: single

  # Nightly Grid Data to Google Sheet
  # Long term daily statistics, ROI, etc are calculated here
  - alias: Log Solar Data to Google Sheets
    id: "google_sheet_solar_update"
    trigger:
      - platform: time
        at: "23:58:00"
    action:
      - service: notify.send_message
        alias: "Log to /config/solar_log.txt"
        continue_on_error: true
        target:
          entity_id: notify.solar_log
        data:
          message: >-
            {{ now().strftime('%m-%d-%Y') }},
            {{ states('sensor.solark_sol_ark_day_pv_energy') }},
            {{ states('sensor.solark_sol_ark_day_grid_import') }},
            {{ states('sensor.solark_sol_ark_day_grid_export') }},
            {{ states('sensor.solark_sol_ark_day_load_energy') }},
            {{ states('sensor.tesla_energy_today') }},
            {{ states('sensor.ac_compressor_daily_energy') }},
            {{ states('sensor.attic_hvac_daily_energy') }},
            {{ states('input_number.grid_import_rate') }},
            {{ states('input_number.grid_export_rate') }}
      - service: google_sheets.append_sheet
        alias: "Log to Google Sheet"
        data:
          worksheet: "Data"
          config_entry: 01JYQN4AYGRQ9S6WQBJV4T4CBW
          data:
            Date: "{{ now().strftime('%m-%d-%Y') }}"
            Day Grid Import kWh: "{{ float(states('sensor.solark_sol_ark_day_grid_import', rounded=True), default=0) }}"
            Day Grid Export kWh: "{{ float(states('sensor.solark_sol_ark_day_grid_export', rounded=True), default=0) }}"
            Day PV Production kWh: "{{ float(states('sensor.solark_sol_ark_day_pv_energy', rounded=True), default=0) }}"
            Day Battery Charge kWh: "{{ float(states('sensor.solark_sol_ark_day_battery_charge', rounded=True), default=0) }}"
            Day Battery Discharge kWh: "{{ float(states('sensor.solark_sol_ark_day_battery_discharge', rounded=True), default=0) }}"
            Day Total Load Energy kWh: "{{ float(states('sensor.solark_sol_ark_day_load_energy', rounded=True), default=0) }}"
            Day EV kWh: "{{ float(states('sensor.tesla_energy_today', rounded=True), default=0) }}"
            Day HVAC kWh: "{{ float(states('sensor.ac_compressor_daily_energy', rounded=True), default=0) + float(states('sensor.attic_hvac_daily_energy', rounded=True), default=0) }}"
            Day Avoided kWh (load - import): "{{ float(states('sensor.solark_sol_ark_day_load_energy', rounded=True), default=0) - float(states('sensor.solark_sol_ark_day_grid_import', rounded=True), default=0) }}"
            Day Peak Output: "{{ float(states('input_number.day_solar_power_peak'), default=0) }}"
            Grid Import Rate: "{{ float(states('input_number.grid_import_rate')) }}"
            Grid Export Rate: "{{ float(states('input_number.grid_export_rate')) }}"

  - alias: "Notify on Sol-Ark Daily PV Reset"
    description: "Sends a notification when the Sol-Ark daily energy sensor resets to zero."
    trigger:
      - platform: numeric_state
        entity_id: sensor.solark_sol_ark_day_pv_energy
        below: 0.1
    condition:
      - condition: template
        value_template: "{{ (trigger.from_state.state | float > 0) and states('sensor.solark_sol_ark_solar_power') | int > 1}}"
    action:
      - service: script.notify_wrapper
        data:
          message: "Sol-Ark daily PV energy has reset to 0."
      - delay: "00:10:00" # Also prevent re-trigger
    mode: single

  - alias: "Inverter State Change"
    mode: queued
    id: "inverter_state_alert"
    trigger:
      - platform: state
        entity_id: sensor.solark_sol_ark_overall_state
    condition: "{{ trigger.from_state.state not in ['unavailable', 'unknown'] and trigger.to_state.state not in ['unavailable'] }}"
    action:
      - action: script.notify_wrapper
        data:
          message: >-
            {% if trigger.to_state.state == 'fault' %}
              {{ trigger.to_state.attributes.friendly_name }} {{ trigger.from_state.state }} --> {{ trigger.to_state.state }} ({{ states('sensor.solark_sol_ark_fault_status') }}): {{ now().strftime('%Y-%m-%d %T') }}"
            {% else %}
              {{ trigger.to_state.attributes.friendly_name }} {{ trigger.from_state.state }} --> {{ trigger.to_state.state }}: {{ now().strftime('%Y-%m-%d %T') }}"
            {% endif %}


  - alias: Battery Charge Limit - Away Mode Protection
    id: b84c9ec2-ae80-4b49-8520-f1583705c23e
    description: >
      Throttle charge to 0A at 99% if away. Restore to 200A if battery drops 
      below 80%, someone comes home, or 1 hour before sunset while away.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.solark_sol_ark_battery_soc
        above: 98
        id: throttle_needed
        alias: Battery SOC rises to 99%
        
      - platform: numeric_state
        entity_id: sensor.solark_sol_ark_battery_soc
        below: 80
        id: restore_needed
        alias: Battery SOC drops below 80%
        
      - platform: state
        entity_id: group.trackers
        to: home
        id: restore_needed
        alias: Someone returns home
        
      - platform: sun
        event: sunset
        offset: "-01:00:00"
        id: sunset_restore
        alias: One hour before sunset

    condition:
      # Global condition: Only run if Guest Mode is off
      - condition: state
        entity_id: input_boolean.guest_mode # Replace with your actual guest mode entity
        state: 'off'
    action:
      - choose:
          # PATH 1: THROTTLE TO 0A
          # Fired by hitting 99% SOC, but ONLY if you are actually away.
          - conditions:
              - condition: trigger
                id: throttle_needed
              - condition: state
                entity_id: group.trackers
                state: not_home
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solark_sol_ark_battery_max_charge_current # Replace with your actual entity
                data:
                  value: 0

          # PATH 2: RESTORE TO 200A (Sunset Version)
          # Fired by the sunset trigger, but ONLY if you are away.
          - conditions:
              - condition: trigger
                id: sunset_restore
              - condition: state
                entity_id: group.trackers
                state: not_home
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solark_sol_ark_battery_max_charge_current
                data:
                  value: 200

          # PATH 3: RESTORE TO 200A (Standard Version)
          # Fired by dropping below 80% OR someone coming home (doesn't care about away status).
          - conditions:
              - condition: trigger
                id: restore_needed
            sequence:
              - service: number.set_value
                target:
                  entity_id: number.solark_sol_ark_battery_max_charge_current
                data:
                  value: 200

  - alias: "Lock in daily solar max sensor"
    mode: single
    trigger:
      - platform: time
        at: "23:50:00"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.day_solar_power_peak
        data:
          value: "{{ states('sensor.solar_power_max_today_live') | float(0) }}"

  - alias: Sol-Ark Overrides on Grid Outage
    id: "solark_grid_outage"
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.solark_sol_ark_grid_connected_status
        to: "off"
    action:
      - variables:
          timeout_minutes: >
            {% if states('sensor.solark_sol_ark_battery_soc')|int >= 70 %}
              240          
            {% elif states('sensor.solark_sol_ark_battery_soc')|int >= 50 %}
              180
            {% elif states('sensor.solark_sol_ark_battery_soc')|int >= 30 %}
              150
            {% elif states('sensor.solark_sol_ark_battery_soc')|int >= 20 %}
              30
            {% else %}
              6
            {% endif %}
      - wait_for_trigger:
          - platform: state
            entity_id: binary_sensor.solark_sol_ark_grid_connected_status
            to: "on"
        timeout: 
          minutes: "{{ timeout_minutes }}"
        continue_on_timeout: true
      - if: "{{ is_state('binary_sensor.solark_sol_ark_grid_connected_status','off') }}"
        then:
          - variables:
              previous_climate_mode: "{{ states('climate.thermostat') }}"
          - service: script.notify_wrapper
            data:
              message: "Turned HVAC off due to extended grid outage"
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.thermostat
            data:
              hvac_mode: "off"
          - wait_for_trigger:
              - platform: state
                entity_id: binary_sensor.solark_sol_ark_grid_connected_status
                to: "on"
          - service: climate.set_hvac_mode
            target:
              entity_id: climate.thermostat
            data:
              hvac_mode: "{{ previous_climate_mode }}"
          - service: rest_command.adjust_force_eval

  - alias: Home Battery Charged Notification
    id: home_battery_charged_notification
    trigger:
      - platform: numeric_state
        entity_id: sensor.solark_sol_ark_battery_soc
        above: 97
    action:
      - action: notify.alexa_media_kitchen
        data:
          data:
            type: tts
            method: speak
          message: <audio src="soundbank://soundlibrary/alarms/chimes_and_bells/chimes_bells_04"/>

input_number:
  day_solar_power_peak:
    name: Day Solar Power Peak Output
    min: 0
    max: 15000   # adjust for your array size
    unit_of_measurement: "W"
  grid_import_rate:
    name: Grid Import Rate
    unit_of_measurement: "USD/kWh"
    min: 0
    max: 1
    step: 0.0001
  grid_export_rate:
    name: Grid Export Rate
    unit_of_measurement: "USD/kWh"
    min: 0
    max: 1
    step: 0.0001

script:
  solar_summary_alexa_response:
    sequence:
      - service: conversation.process
        data:
          agent_id: conversation.chatgpt
          text: >-
            You will the question 'how is solar looking' in a friendly, succinct spoken
            report. Be sure include info about battery percent.
            
            If the sun is up, include information about how the solar forecast
            looks,current production, and total production for the day.

            
            If the sun has set, summarize how we produced today, but no need to
            tell me that we aren't currently producing. 

            Regardless, also tell about grid import and export, both in kWH as well as cost.
            
            Don't prompt the user for followups or offer to provide more details. Also, always convert watts to kW.
        response_variable: convo
      - action: notify.alexa_media_last_called
        data:
          data:
            type: tts
          message: '{{ convo.response.speech.plain.speech }}'

template:
