substitutions:
  name: kmc_multi_plug_2
  friendly_name: "kmc_multi_plug_2"
  
esphome:
  name: ${name}

esp8266:
  board: esp01_1m
  restore_from_flash: true

<<: !include common.yaml

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: 'America/Chicago'

sensor:
  - platform: hlw8012
    sel_pin: GPIO12
    cf_pin: GPIO4
    cf1_pin: GPIO5
    current:
      name: "${friendly_name} Current"
    voltage:
      name: "${friendly_name} Voltage"
    power:
      name: "${friendly_name} Power"
    update_interval: 60s

switch:
  - platform: gpio
    name: "${friendly_name} relay 1"
    pin: GPIO15
    id: relay1
  - platform: gpio
    name: "${friendly_name} relay 2"
    pin: GPIO13
    id: relay2
  - platform: gpio
    name: "${friendly_name} relay 3"
    pin: GPIO14
    id: relay3
  - platform: restart
    id: restart_device
    name: "${friendly_name} Restart"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO16
      mode: INPUT_PULLDOWN
      inverted: True
    name: "${friendly_name} Button"
    # on_press:
    #   - switch.toggle: relay2
    # on_double_click:
    #   min_length: 50ms
    #   max_length: 350ms
    #   then:
    #   - switch.turn_off: relay1
    #   - switch.turn_off: relay2
    #   - switch.turn_off: relay3

status_led:
  pin:
    number: GPIO1
    inverted: yes