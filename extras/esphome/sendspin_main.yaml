# =============================================================================
# HARDWARE INFORMATION
# =============================================================================
# ESP32 Chip: ESP32-S3 rev0.2, 2 core(s)
# ESP32-S3-DevkitC-1 V1.0
# Onboard LED -> GPIO48
# =============================================================================
  
# =============================================================================
# Basic ESPHome configurations
# =============================================================================
# Core board ESP32-S3-DevkitC-1
# Lgger, OTA, Fallback hotpot and PSRAM enabled
# By default of PlatformIO, board: esp32-s3-devkitc-1 means for a non-PSRAM version.
# "platformio_options" must be defined to overwrite the default options of the board,
# to give right confirmation for N16R8
# =============================================================================

substitutions:
  name: "sendspin-main"
  friendly_name: "SendSpin Main"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  flash_size: 16MB
  toolchain: esp-idf  
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_BT_ENABLED: "n"                     # Keep this to free up RAM/CPU from Bluetooth
      CONFIG_ESP_WIFI_TASK_CORE_ID: "0"          # Keep if you specifically want Wi-Fi pinned to core 0
      CONFIG_ESP_WIFI_IRAM_OPT: "y"              # Moves Wi-Fi high-performance code to ultra-fast IRAM
      CONFIG_ESP_WIFI_RX_BA_WIN: "16"            # Increases Wi-Fi Block Ack RX window size for smoother TCP/UDP streams

# Enable logging
logger:
  level: DEBUG
  logs:
    sensor: WARN 

ota:
  platform: esphome
  password: esphome_recovery

# Wifi setup
wifi:
  ssid: "SSID"
  password: !secret wifi_password
  power_save_mode: NONE

network:
  enable_high_performance: true

# Mandatory for ESP32-S3 modules with 8MB/16MB PSRAM
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key

  reboot_timeout: 0s

# # Enable http request
