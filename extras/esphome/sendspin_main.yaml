# =============================================================================
# Media player / I2S configurations
# =============================================================================
# At sample rate 44100Hz, 2 channels, 16bit, every 1ms buffer uses about 176.4 Bytes
# 100ms - 17.64K, 200ms - 35.2KB, 500ms # Increased from 100 5/16 - 86.13KB
# If no sound by setting bits_per_sample to 32bit, set to 16bit instead
# =============================================================================
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO17

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_audio_id: i2s_out
    sample_rate: 48000
    i2s_dout_pin: GPIO16
    bits_per_sample: 16bit
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms # Increased from 100 5/16 # Increased from 100 5/16

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: i2s_audio_speaker
    source_speakers:
      - id: media_spk_mixer_input
        buffer_duration: 100ms # Increased from 100 5/16
        timeout: never
      - id: announcement_spk_mixer_input
        buffer_duration: 100ms # Increased from 100 5/16
        timeout: never
    num_channels: 2
    task_stack_in_psram: true

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_spk_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 100ms # Increased from 100 5/16
    task_stack_in_psram: true
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_spk_mixer_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 100ms # Increased from 100 5/16
    task_stack_in_psram: true

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true # troubleshooting set to true

media_source:
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
  - platform: sendspin
    id: sendspin_media_source

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
  - platform: speaker_source
    name: ${friendly_name}
    id: external_media_player
    internal: false
    media_pipeline:
        speaker: media_resampling_speaker
        format: FLAC # troubleshooting set from MP3
        sample_rate: 48000
        num_channels: 2
        sources:
          - http_media_source
          - sendspin_media_source
    announcement_pipeline:
        speaker: announcement_resampling_speaker
        format: FLAC # troubleshooting set from MP3
        sample_rate: 48000
        num_channels: 1
        sources:
          - http_announcement_source
    volume_increment: 0.02
    volume_initial: 0.20
    volume_min: 0.05
    volume_max: 0.95
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_spk_mixer_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      if:
        condition:
          not:
            media_player.is_announcing: external_media_player
        then:
          - mixer_speaker.apply_ducking:
              id: media_spk_mixer_input
              decibel_reduction: 0
              duration: 1.0s

switch:
  - platform: restart
    id: restart_device
    name: "${friendly_name} Restart"
