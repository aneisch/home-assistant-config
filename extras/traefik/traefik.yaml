api:
  dashboard: true

accessLog:
  #filePath: /logs/access.log   # omit to log to stdout
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        CF-Connecting-IP: keep
        User-Agent: keep
        X-Forwarded-For: keep

entryPoints:
  web:
    address: ":80"
    # http:
    #   # 80-->443 redirect for all
    #   redirections:
    #     entryPoint:
    #       to: websecure
    forwardedHeaders:
      trustedIPs:
        - "10.0.1.22/32"
        - "127.0.0.1/32"
    observability:
      accessLogs: false

  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs:
        - "10.0.1.22/32"
        - "127.0.0.1/32"
    # The {} is necessary
    http3: {}
    http:
      middlewares:
        - secureHeaders@file
    observability:
      accessLogs: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: "/etc/traefik"
    watch: true

certificatesResolvers:
  le-home:
    acme:
      dnsChallenge:
        provider: cloudflare
      email: "EMAIL"
      storage: "/etc/traefik/acme.json"
      certificatesduration: 2160

experimental:
  plugins:
    sablier:
      moduleName: "github.com/sablierapp/sablier-traefik-plugin"
      version: "v1.3.0"

